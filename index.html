<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Znojmo chutná — hero + navigace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Znojmo chutná — design tokens
   Fonty: Space Grotesk (display) + Space Mono (labels)
   Dvě témata: dark (signature, dle konceptu v3) + light (cream)
   ============================================================ */
:root{
  --font-display:'Space Grotesk', system-ui, -apple-system, sans-serif;
  --font-mono:'Space Mono', ui-monospace, 'SF Mono', monospace;

  --max: 1320px;
  --gutter: clamp(20px, 5vw, 64px);
  --radius: 14px;
  --radius-lg: 22px;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* ---- DARK (výchozí, dle prtsc) ---- */
:root[data-theme="dark"]{
  --bg:        #0F3A25;
  --bg-hero:   #103B26;
  --panel:     #124631;   /* elevovaný povrch mega menu */
  --panel-2:   #0C3020;
  --ink:       #F3F5EC;
  --ink-dim:   #A9C7B6;
  --mint:      #86C7A2;    /* akcent — „létem" */
  --mint-hi:   #A6DCBE;
  --mono:      #5F8C74;
  --line:      rgba(243,245,236,.12);
  --line-soft: rgba(243,245,236,.07);
  --chip:      rgba(243,245,236,.06);
  --chip-hi:   rgba(243,245,236,.12);
  --glow:      radial-gradient(120% 90% at 15% 0%, rgba(134,199,162,.16), transparent 60%);
  --shadow:    0 30px 80px -30px rgba(0,0,0,.6);
}

/* ---- LIGHT (cream) ---- */
:root[data-theme="light"]{
  --bg:        #F1F1E6;
  --bg-hero:   #F1F1E6;
  --panel:     #FBFBF3;
  --panel-2:   #FFFFFF;
  --ink:       #103A25;
  --ink-dim:   #4E6E5B;
  --mint:      #2E8B5C;
  --mint-hi:   #1F7A4C;
  --mono:      #6E9080;
  --line:      rgba(16,58,37,.14);
  --line-soft: rgba(16,58,37,.08);
  --chip:      rgba(16,58,37,.05);
  --chip-hi:   rgba(16,58,37,.10);
  --glow:      radial-gradient(120% 90% at 15% 0%, rgba(46,139,92,.10), transparent 60%);
  --shadow:    0 30px 70px -34px rgba(16,58,37,.28);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:var(--font-display);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  transition:background .4s var(--ease), color .4s var(--ease);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.mono{
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--mono);
}

/* ============================================================
   HEADER + NAV
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
  transition:background .4s var(--ease), border-color .4s var(--ease);
}
.bar{
  max-width:var(--max);margin-inline:auto;
  padding:0 var(--gutter);
  height:74px;
  display:flex;align-items:center;gap:32px;
}

/* Wordmark */
.wordmark{
  font-weight:600;font-size:20px;letter-spacing:-.01em;
  display:inline-flex;align-items:center;gap:.4ch;
  white-space:nowrap;
}
.wordmark b{font-weight:600;color:var(--ink)}
.wordmark i{font-style:normal;color:var(--mint)}
.wordmark .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);margin-left:2px}

/* Primary nav */
.nav{display:flex;gap:4px;margin-inline-start:8px}
.nav-item{
  position:relative;
  padding:10px 14px;border-radius:10px;
  font-weight:500;font-size:15px;color:var(--ink-dim);
  display:inline-flex;align-items:center;gap:7px;
  transition:color .2s var(--ease), background .2s var(--ease);
}
.nav-item:hover,.nav-item[aria-expanded="true"]{color:var(--ink);background:var(--chip)}
.nav-item .caret{width:8px;height:8px;opacity:.6;transition:transform .25s var(--ease)}
.nav-item[aria-expanded="true"] .caret{transform:rotate(180deg)}

/* Tools (right) */
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  height:40px;padding:0 14px;border-radius:10px;
  display:inline-flex;align-items:center;gap:8px;
  font-size:14px;color:var(--ink-dim);
  border:1px solid transparent;
  transition:.2s var(--ease);
}
.icon-btn:hover{color:var(--ink);background:var(--chip)}
.icon-btn svg{width:16px;height:16px}
.lang{display:inline-flex;align-items:center;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.lang button{font-family:var(--font-mono);font-size:12px;padding:6px 9px;border-radius:7px;color:var(--ink-dim);letter-spacing:.05em}
.lang button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.theme-toggle{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-dim);
  transition:.2s var(--ease);
}
.theme-toggle:hover{color:var(--ink);border-color:var(--ink-dim)}
.theme-toggle svg{width:17px;height:17px}
.theme-toggle .sun{display:none}
:root[data-theme="light"] .theme-toggle .sun{display:block}
:root[data-theme="light"] .theme-toggle .moon{display:none}

.burger{display:none}

/* ============================================================
   MEGA MENU
   ============================================================ */
.mega-wrap{
  position:absolute;left:0;right:0;top:100%;
  display:flex;justify-content:center;
  pointer-events:none;
  opacity:0;transform:translateY(-10px);
  transition:opacity .22s var(--ease), transform .22s var(--ease);
}
.site-header.open .mega-wrap{opacity:1;transform:none;pointer-events:auto}
.mega{
  width:min(calc(100% - 2*var(--gutter)), var(--max));
  margin-top:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel{display:none;grid-template-columns:1fr 1fr 1fr .95fr;gap:0}
.panel.active{display:grid}
.col{
  padding:26px 26px 30px;
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:4px;
}
.col-title{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--mono);margin-bottom:12px}
.m-link{
  padding:9px 10px;margin:0 -10px;border-radius:9px;
  display:flex;flex-direction:column;gap:1px;
  transition:background .16s var(--ease);
}
.m-link:hover{background:var(--chip)}
.m-link .t{font-weight:500;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.m-link .d{font-size:12.5px;color:var(--ink-dim)}
.m-link:hover .t{color:var(--mint-hi)}

.col-action{margin-top:auto;padding-top:16px}
.action-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:11px;border:1px dashed var(--line);
  color:var(--ink);font-weight:500;font-size:14px;width:100%;
  transition:.18s var(--ease);
}
.action-btn:hover{border-color:var(--mint);color:var(--mint-hi);border-style:solid}
.action-btn small{font-family:var(--font-mono);font-size:10px;color:var(--mono);text-transform:uppercase;letter-spacing:.1em}

/* Featured card (poslední sloupec) */
.feat{
  position:relative;padding:24px;border-right:none;
  display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  color:#fff;min-height:250px;isolation:isolate;
}
.feat::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.96}
.feat.wine::before  {background:linear-gradient(150deg,#7a2b48 0%,#3a2b52 46%,#134a30 100%)}
.feat.map::before   {background:linear-gradient(150deg,#1f6a4a 0%,#14503a 55%,#0c3324 100%)}
.feat.cellar::before{background:linear-gradient(150deg,#5a3a1f 0%,#3f3a24 45%,#123a26 100%)}
.feat.plan::before  {background:linear-gradient(150deg,#1c5e63 0%,#164a44 52%,#0e3a2c 100%)}
.feat .ghost{position:absolute;right:-12px;top:-24px;font-size:150px;line-height:1;font-weight:700;color:rgba(255,255,255,.08);z-index:-1;letter-spacing:-.04em}
.feat .kicker{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:rgba(255,255,255,.72)}
.feat .f-title{font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.feat .f-meta{font-size:12.5px;color:rgba(255,255,255,.8);font-family:var(--font-mono)}
.feat .f-go{margin-top:10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.feat:hover .f-go{gap:11px}
.feat .f-go{transition:gap .2s var(--ease)}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  background:var(--bg-hero);
  background-image:var(--glow);
  transition:background .4s var(--ease);
}
.hero-labels{
  max-width:var(--max);margin-inline:auto;
  padding:22px var(--gutter) 0;
  display:flex;justify-content:space-between;
}
.hero-inner{
  max-width:var(--max);margin-inline:auto;
  padding:clamp(40px,7vw,86px) var(--gutter) 0;
}
h1{
  font-weight:700;letter-spacing:-.035em;line-height:.92;
  font-size:clamp(56px, 12vw, 168px);
}
h1 .line{display:block}
h1 .accent{color:var(--mint)}
.lede{
  margin-top:clamp(24px,3.4vw,40px);
  max-width:30ch;
  font-size:clamp(17px,1.6vw,21px);
  line-height:1.5;color:var(--ink-dim);font-weight:400;
}
.hero-actions{margin-top:32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  height:52px;padding:0 26px;border-radius:12px;
  font-weight:500;font-size:16px;
  display:inline-flex;align-items:center;gap:10px;
  transition:.2s var(--ease);
}
.btn-primary{background:var(--mint);color:#0C3020}
.btn-primary:hover{background:var(--mint-hi);transform:translateY(-2px)}
:root[data-theme="light"] .btn-primary{color:#F3F5EC}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-dim);background:var(--chip)}
.chips{display:inline-flex;gap:8px;margin-inline-start:6px}
.chip{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;
  padding:9px 15px;border-radius:999px;background:var(--chip);color:var(--ink-dim);
  border:1px solid transparent;transition:.18s var(--ease);
}
.chip:hover{background:var(--chip-hi);color:var(--ink)}
.chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint);margin-right:8px;vertical-align:middle}

/* „Nenechte si ujít" pás akcí */
.strip{
  max-width:var(--max);margin:clamp(48px,6vw,80px) auto 0;
  padding:22px var(--gutter) clamp(28px,4vw,44px);
  border-top:1px solid var(--line-soft);
  display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;
}
.strip-head{display:flex;flex-direction:column;gap:6px;padding-top:4px;white-space:nowrap}
.strip-head .h{font-weight:600;font-size:15px}
.strip-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ecard{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;
  transition:.2s var(--ease);background:var(--chip);
}
.ecard:hover{border-color:var(--ink-dim);transform:translateY(-3px)}
.ecard .cat{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mint)}
.ecard .et{font-weight:600;font-size:16.5px;line-height:1.18;letter-spacing:-.01em}
.ecard .em{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);margin-top:auto}

/* Scrim za otevřeným mega menu */
.scrim{
  position:fixed;inset:74px 0 0;z-index:40;
  background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease);
}
.site-header.open ~ .scrim{opacity:1}

/* ============================================================
   MOBILE
   ============================================================ */
#mobileNav{display:none}
@media (max-width:960px){
  .nav,.tools .icon-btn.search span,.strip-head{display:none}
  .burger{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;color:var(--ink);margin-inline-start:auto}
  .tools{margin-inline-start:0;gap:4px}
  .mega-wrap{display:none}
  .strip{grid-template-columns:1fr}
  .strip-cards{grid-template-columns:1fr}

  #mobileNav{
    position:fixed;inset:74px 0 0;z-index:55;display:block;
    background:var(--bg);padding:14px var(--gutter) 40px;
    overflow-y:auto;transform:translateY(-8px);opacity:0;pointer-events:none;
    transition:.25s var(--ease);
  }
  body.nav-open #mobileNav{transform:none;opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
  .m-sec{border-bottom:1px solid var(--line-soft)}
  .m-sec>summary{
    list-style:none;cursor:pointer;padding:18px 4px;
    font-size:20px;font-weight:600;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:space-between;
  }
  .m-sec>summary::-webkit-details-marker{display:none}
  .m-sec>summary .plus{color:var(--mint);font-weight:400;transition:transform .2s var(--ease)}
  .m-sec[open]>summary .plus{transform:rotate(45deg)}
  .m-sec .m-body{padding:0 4px 18px;display:flex;flex-direction:column;gap:2px}
  .m-sec .m-body a{padding:9px 0;font-size:16px;color:var(--ink-dim)}
  .m-sec .m-body a:hover{color:var(--mint)}
}
@media (max-width:560px){
  .bar{gap:14px}
  .hero-actions .chips{margin-inline-start:0;width:100%}
  .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="site-header" id="header">
  <div class="bar">
    <a class="wordmark" href="#" aria-label="Znojmo chutná — domů">

      <button class="icon-btn search" aria-label="Hledat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Hledat</span>
      </button>
      <div class="lang" role="group" aria-label="Jazyk">
        <button aria-pressed="true">CS</button>

        <button aria-pressed="false">DE</button>

      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

<div class="scrim" id="scrim"></div>

<main class="hero">

  </div>

  <div class="hero-inner">
    <h1>
      <span class="line">Znojmo chutná</span>
      <span class="line accent">létem</span>
    </h1>
    <p class="lede">Program, víno, památky i tipy na výlet — celé menu města na jednom místě.</p>

    <div class="hero-actions">
      <a class="btn btn-primary" href="#">Prohlédnout program
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="btn btn-ghost" href="#">Objevit Znojmo</a>
      <span class="chips">
        <button class="chip">Dnes</button>
        <button class="chip">Tento víkend</button>
      </span>

  <section class="strip" aria-label="Nenechte si ujít">
    <div class="strip-head">
      <span class="mono">Právě teď</span>
      <span class="h">Nenechte si ujít</span>

    <div class="strip-cards" id="stripCards"></div>
  </section>
</main>

<nav id="mobileNav" aria-label="Mobilní navigace"></nav>

  {cat:'Festival', t:'Znojemské vinobraní', m:'12.–14. 9.'},
  {cat:'Divadlo',  t:'Léto na nádvoří Domu umění', m:'Dnes · 20:00'},
  {cat:'Koncert',  t:'Kulturní léto: Podyjí Sessions', m:'So · 19:30'},
];

/* ---- render helpers ---- */
const el = (html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
const arrow = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

/* Desktop: nav triggers + mega panels */
const nav = document.getElementById('nav');
const mega = document.getElementById('mega');
Object.entries(MENU).forEach(([key,data])=>{
  nav.appendChild(el(`
    <button class="nav-item" data-menu="${key}" aria-haspopup="true" aria-expanded="false">
      ${data.label}
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
    </button>`));

  const cols = data.columns.map(c=>`
    <div class="col">
      <div class="col-title">${c.title}</div>
      ${c.links.map(l=>`
        <a class="m-link" href="#">
          <span class="t">${l.t}${l.arrow?arrow:''}</span>
          ${l.d?`<span class="d">${l.d}</span>`:''}
        </a>`).join('')}
      ${c===data.columns[data.columns.length-1] && data.action?`
        <div class="col-action">
          <a class="action-btn" href="#">
            <span>${data.action.t}</span>
            <small>${data.action.note}</small>
          </a>
        </div>`:''}
    </div>`).join('');

  const f = data.featured;
  const feat = `
    <a class="col feat ${f.theme}" href="#">
      <span class="ghost">${f.ghost}</span>
      <span class="kicker">${f.kicker}</span>
      <span class="f-title">${f.title}</span>
      <span class="f-meta">${f.meta}</span>
      <span class="f-go">Zobrazit ${arrow}</span>
    </a>`;

  mega.appendChild(el(`<div class="panel" data-panel="${key}">${cols}${feat}</div>`));
});

/* Mobile accordion (ze stejných dat) */
const mob = document.getElementById('mobileNav');
Object.entries(MENU).forEach(([key,data])=>{
  const links = data.columns.flatMap(c=>c.links).map(l=>`<a href="#">${l.t}</a>`).join('');
  mob.appendChild(el(`
    <details class="m-sec">
      <summary>${data.label}<span class="plus">+</span></summary>
      <div class="m-body">${links}${data.action?`<a href="#">${data.action.t} →</a>`:''}</div>
    </details>`));
});

/* Strip cards */
const stripCards = document.getElementById('stripCards');
STRIP.forEach(e=>stripCards.appendChild(el(`
  <a class="ecard" href="#">
    <span class="cat">${e.cat}</span>
    <span class="et">${e.t}</span>
    <span class="em">${e.m}</span>
  </a>`)));

/* ============================================================
   Interakce: mega menu (hover + focus + click + Esc)
   ============================================================ */
const header = document.getElementById('header');
const triggers = [...document.querySelectorAll('[data-menu]')];
const panels = [...document.querySelectorAll('[data-panel]')];
let closeTimer;

function openMenu(key){
  clearTimeout(closeTimer);
  header.classList.add('open');
  panels.forEach(p=>p.classList.toggle('active', p.dataset.panel===key));
  triggers.forEach(t=>t.setAttribute('aria-expanded', String(t.dataset.menu===key)));
}
function closeMenu(){
  header.classList.remove('open');
  panels.forEach(p=>p.classList.remove('active'));
  triggers.forEach(t=>t.setAttribute('aria-expanded','false'));
}
const scheduleClose = ()=>{closeTimer=setTimeout(closeMenu,150);};

triggers.forEach(t=>{
  const key=t.dataset.menu;
  t.addEventListener('mouseenter',()=>openMenu(key));
  t.addEventListener('click',e=>{
    e.preventDefault();
    const isOpen = header.classList.contains('open') && t.getAttribute('aria-expanded')==='true';
    isOpen ? closeMenu() : openMenu(key);
  });
});
header.addEventListener('mouseleave',scheduleClose);
header.addEventListener('mouseenter',()=>clearTimeout(closeTimer));
/* zavřít při odchodu fokusu z headeru (klávesnice) */
header.addEventListener('focusout',e=>{ if(!header.contains(e.relatedTarget)) scheduleClose(); });
document.getElementById('scrim').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});

/* Theme toggle */
const root=document.documentElement;
document.getElementById('themeToggle').addEventListener('click',()=>{
  root.dataset.theme = root.dataset.theme==='light'?'dark':'light';
});

/* Language pills */
document.querySelectorAll('.lang button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.lang button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
  });
});

/* Mobile burger */
const burger=document.getElementById('burger');
burger.addEventListener('click',()=>{
  const open=document.body.classList.toggle('nav-open');
  burger.setAttribute('aria-expanded',String(open));
});
</script>
</body>
</html>
